apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pantry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mayank-0789/pantryplus-capstone.git
    targetRevision: main
    path: helm/pantry
    helm:
      releaseName: pantry
      valueFiles: [values.yaml, values-gitops.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: pantry
  syncPolicy:
    # Enable automated sync after setting a published SHA and verifying the target cluster.
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: pantry-backend
      jsonPointers: [/spec/replicas]
