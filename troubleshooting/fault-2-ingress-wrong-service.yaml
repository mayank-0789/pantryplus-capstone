apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pantry
  namespace: pantry
spec:
  ingressClassName: nginx
  rules:
    - host: pantry.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: pantry-backend-v2, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: pantry-frontend, port: { number: 80 } } }
