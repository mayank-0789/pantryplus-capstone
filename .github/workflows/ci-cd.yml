name: Pantry Plus checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pantry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt pip-audit bandit
      - run: python -m pytest -v --junitxml=junit.xml
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/pantry && helm template pantry helm/pantry --namespace pantry > /tmp/rendered.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check && terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: pantry-${{ matrix.service }}:${{ github.sha }}
      - name: Scan every HIGH and CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: pantry-${{ matrix.service }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json
      - run: docker save pantry-${{ matrix.service }}:${{ github.sha }} -o /tmp/${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1
  publish:
    # Explicit release opt-in; both image scans must succeed first.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images
      - name: Publish the scanned images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in backend frontend; do
            docker load -i "/tmp/images/$service.tar"
            target="ghcr.io/${GITHUB_REPOSITORY,,}/$service:$GITHUB_SHA"
            docker tag "pantry-$service:$GITHUB_SHA" "$target"
            docker push "$target"
          done
